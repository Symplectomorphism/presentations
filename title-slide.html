<section id="title-slide">
  <h1 class="title">$title$</h1>
  $if(author)$
  <div style="position: relative;">
    $if(subtitle)$
    <p class="subtitle">$subtitle$</p>
    $endif$
    <div
      style="position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; pointer-events: none;">
      <img src="contents/assets/utd_emblem.svg" style="height: 80px;">
      <img src="contents/assets/teros_logo_2026.png" style="height: 80px;">
    </div>
    <p class="author">$author$</p>
  </div>
  $else$
  $if(subtitle)$
  <p class="subtitle">$subtitle$</p>
  $endif$
  $endif$
  $if(institute)$
  <p class="institute">$institute$</p>
  $endif$
  $if(date)$
  <p class="date">$date$</p>
  $endif$
</section>
