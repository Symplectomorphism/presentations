<section id="title-slide">
  <div class="title-band">
    <img src="contents/assets/utd_emblem.svg" alt="UT Dallas">
    <h1 class="title">$title$</h1>
  </div>
  $if(subtitle)$
  <p class="subtitle">$subtitle$</p>
  $endif$
  <p class="author">$author$</p>
  $if(role)$
  <p class="role">$role$</p>
  $endif$
  $if(institute)$
  <p class="institute">$institute$</p>
  $endif$
  $if(date)$
  <p class="date">$date$</p>
  $endif$
</section>
