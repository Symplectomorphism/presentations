<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Presentations · Aykut C. Satici</title>
  <style>
    :root {
      --bg: #fbfaf7;
      --fg: #1c1d1f;
      --muted: #6a6c70;
      --line: #e4e1da;
      --hover: #f1eee7;
      --accent: #c75b12; /* UT Dallas orange */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16171a;
        --fg: #e9e8e4;
        --muted: #9a9ca1;
        --line: #2c2e33;
        --hover: #1f2125;
        --accent: #f08a3e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 64px 16px 80px; }
    header { margin-bottom: 40px; }
    h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 4px; }
    header p { margin: 0; color: var(--muted); }
    header a { color: inherit; }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    .deck {
      display: block;
      padding: 18px 12px;
      margin: 0 -12px;
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
    }
    .deck:hover, .deck:focus-visible { background: var(--hover); outline: none; }
    .deck:hover .title, .deck:focus-visible .title { color: var(--accent); }
    .meta {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .title { display: block; font-size: 1.15rem; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Presentations</h1>
      <p>Aykut C. Satici · Department of Systems Engineering, UT Dallas</p>
    </header>
    <ul>
{{CARDS}}
    </ul>
  </main>
</body>
</html>
